<style>

<!-- =======================================================
     PORTFOLIO
     ======================================================= -->

<div class="igor-editorial">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="editorial-header">

    <div class="editorial-name">
      Igor Medeiroz
    </div>

    <div class="editorial-section">
      Photography — Collections
    </div>

    <nav class="editorial-nav">

      <a href="/p/sobre.html">
        About
      </a>

      <a href="/p/contato.html">
        Contact
      </a>
      


    </nav>

  </header>


  <!-- =====================================================
       INTRO
       ===================================================== -->

  <section class="editorial-intro">

  <h1>
    Photography <br>
    as a way of <br>
    <span id="changing-word">remembering.</span>
  </h1>


    <div class="editorial-intro-info">

      <span>
        Selected work
      </span>

      A collection of photographs,
      projects and visual studies
      developed over time.

    </div>

  </section>


  <!-- =====================================================
       PROJETOS
       ===================================================== -->

  <main
    class="editorial-projects"
    id="editorial-projects"
  >

    <!--
      Os projetos serão inseridos automaticamente
      através do feed do Blogger.
    -->

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->




<script>

(function () {

  "use strict";


  /* =======================================================
     CONFIGURAÇÃO
     ======================================================= */

  const FEED_URL =
    "/feeds/posts/default/-/fotografia?alt=json&max-results=50";


  const portfolio =
    document.getElementById(
      "editorial-projects"
    );


  if (!portfolio) {
    return;
  }


  /* =======================================================
     ESCAPAR HTML
     
     Evita que títulos dos posts possam quebrar
     a estrutura do HTML.
     ======================================================= */

  function escapeHTML(value) {

    if (!value) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =======================================================
     ENCONTRAR LINK DO POST
     ======================================================= */

  function getPostLink(post) {

    if (!post.link) {
      return "#";
    }


    const link =
      post.link.find(function (item) {

        return item.rel === "alternate";

      });


    return link
      ? link.href
      : "#";

  }


  /* =======================================================
     OBTER CONTEÚDO
     ======================================================= */

  function getPostContent(post) {

    if (post.content && post.content.$t) {

      return post.content.$t;

    }


    if (post.summary && post.summary.$t) {

      return post.summary.$t;

    }


    return "";

  }


  /* =======================================================
     OBTER PRIMEIRA IMAGEM
     ======================================================= */

  function getFirstImage(post, content) {

    /*
       Primeiro tenta o campo media do Blogger.
    */

    if (
      post.media$thumbnail &&
      post.media$thumbnail.url
    ) {

      let image =
        post.media$thumbnail.url;

      /*
         Thumbnail do Blogger costuma vir pequena.
         Tentamos obter uma versão maior.
      */

      image =
        image.replace(
          /\/s[0-9]+(-c)?\//,
          "/s1600/"
        );

      return image;

    }


    /*
       Se não encontrou no media thumbnail,
       procura uma imagem no HTML do post.
    */

    const temp =
      document.createElement("div");

    temp.innerHTML =
      content;


    const image =
      temp.querySelector("img");


    if (image && image.src) {

      return image.src;

    }


    return "";

  }


  /* =======================================================
     OBTER METADADOS
     
     Procura:

     data-portfolio-type="Fashion"

     data-portifolio-local="Lisbon"

     dentro do conteúdo do post.
     ======================================================= */

  function getMetadata(content) {

    const temp =
      document.createElement("div");

    temp.innerHTML =
      content;


    const portfolioElement =
      temp.querySelector(
        ".portfolio[data-portfolio-type], .portfolio[data-portifolio-local]"
      );


    if (!portfolioElement) {

      return {

        type: "",
        local: ""

      };

    }


    const type =
      portfolioElement.getAttribute(
        "data-portfolio-type"
      ) || "";


    const local =
      portfolioElement.getAttribute(
        "data-portifolio-local"
      ) || "";


    return {

      type:
        type.trim(),

      local:
        local.trim()

    };

  }


  /* =======================================================
     CRIAR PROJETO
     ======================================================= */

  function createProject(
    post,
    index
  ) {

    const title =
      post.title
        ? post.title.$t
        : "Untitled";


    const content =
      getPostContent(post);


    const link =
      getPostLink(post);


    const image =
      getFirstImage(
        post,
        content
      );


    const metadata =
      getMetadata(
        content
      );


    /*
       Número com dois dígitos.
       1 → 01
       2 → 02
       etc.
    */

    const number =
      String(index + 1)
        .padStart(2, "0");


    /*
       Cria o elemento.
    */

    const project =
      document.createElement("a");


    project.className =
      "editorial-project";


    project.href =
      link;


    project.target =
      "_blank";


    project.rel =
      "noopener noreferrer";


    /*
       Conteúdo do metadata.

       Se houver type:

       FASHION

       Se houver local:

       LISBON
    */

    let metadataHTML = "";


    if (metadata.type) {

      metadataHTML +=
        `<span>${escapeHTML(metadata.type)}</span>`;

    }


    if (metadata.local) {

      metadataHTML +=
        `<span>${escapeHTML(metadata.local)}</span>`;

    }


    /*
       HTML do projeto.
    */

    project.innerHTML = `

      <span class="project-number">
        ${number}
      </span>


      <span class="project-title">
        ${escapeHTML(title)}
      </span>


      <span class="project-meta">
        ${metadataHTML}
      </span>


      ${
        image
          ? `
            <img
              class="project-image"
              src="${escapeHTML(image)}"
              alt=""
              loading="lazy"
              draggable="false"
            >
          `
          : ""
      }

    `;


    return project;

  }


  /* =======================================================
     CARREGAR FEED
     ======================================================= */

  async function loadPortfolio() {

    try {

      const response =
        await fetch(
          FEED_URL
        );


      if (!response.ok) {

        throw new Error(
          "Não foi possível carregar o feed."
        );

      }


      const data =
        await response.json();


      const entries =
        data &&
        data.feed &&
        data.feed.entry
          ? data.feed.entry
          : [];


      /*
         Limpa o conteúdo.
      */

      portfolio.innerHTML = "";


      /*
         Caso não existam posts.
      */

      if (!entries.length) {

        portfolio.innerHTML = `

          <div
            style="
              padding:40px 0;
              font-family:'DM Mono',monospace;
              font-size:9px;
              letter-spacing:.1em;
              text-transform:uppercase;
              color:#77736d;
            "
          >

            No projects found.

          </div>

        `;

        return;

      }


      /*
         Cria os projetos.
      */

      entries.forEach(
        function (post, index) {

          const project =
            createProject(
              post,
              index
            );


          portfolio.appendChild(
            project
          );

        }
      );


    }

    catch (error) {

      console.error(
        "Portfolio:",
        error
      );


      portfolio.innerHTML = `

        <div
          style="
            padding:40px 0;
            font-family:'DM Mono',monospace;
            font-size:9px;
            letter-spacing:.1em;
            text-transform:uppercase;
            color:#77736d;
          "
        >

          Unable to load projects.

        </div>

      `;

    }

  }


  /* =======================================================
     INICIAR
     ======================================================= */

  loadPortfolio();


})();

</script>
<section class="editorial-intro">


<script>
document.addEventListener("DOMContentLoaded", function () {

  const element = document.getElementById("changing-word");

  const words = [
    "remembering.",
    "seeing.",
    "feeling.",
    "observing.",
    "discovering.",
    "connecting."
  ];

  let wordIndex = 0;
  let letterIndex = 0;
  let deleting = false;

  const typingSpeed = 100;
  const deletingSpeed = 70;
  const pauseAfterWriting = 2500;
  const pauseAfterDeleting = 500;

  function animateWord() {

    const currentWord = words[wordIndex];

    if (!deleting) {

      // ESCREVER
      element.textContent = currentWord.substring(0, letterIndex + 1);
      letterIndex++;

      if (letterIndex === currentWord.length) {

        setTimeout(function () {
          deleting = true;
          animateWord();
        }, pauseAfterWriting);

      } else {
        setTimeout(animateWord, typingSpeed);
      }

    } else {

      // APAGAR
      element.textContent = currentWord.substring(0, letterIndex - 1);
      letterIndex--;

      if (letterIndex === 0) {

        wordIndex = (wordIndex + 1) % words.length;
        deleting = false;

        setTimeout(animateWord, pauseAfterDeleting);

      } else {
        setTimeout(animateWord, deletingSpeed);
      }
    }
  }

  // começa a escrever a primeira palavra
  animateWord();

});
</script>
